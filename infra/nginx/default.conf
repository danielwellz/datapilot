# DataPilot behind one origin: the Angular build as static files, and /api
# proxied to Gunicorn. Same-origin means no CORS, and the refresh cookie
# stays first-party.

server_tokens off;

# One JSON object per request, like the API's own logs; request_id is the
# id the API logs too (see X-Request-ID below).
log_format json escape=json
    '{"time":"$time_iso8601","logger":"nginx.access","request_id":"$api_request_id",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration_ms":$request_time,'
    '"upstream_ms":"$upstream_response_time","user_agent":"$http_user_agent"}';

# Keep a client's request id (the API checks its format) or make one, so a
# line in this log and the API's log can be matched.
map $http_x_request_id $api_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream backend {
    server backend:8000;
    keepalive 16;
    # Shorter than Gunicorn's keepalive (75 s), so Nginx closes idle
    # connections first and never reuses one Gunicorn just closed.
    keepalive_timeout 60s;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout json;

    # Redirects keep the client's host and port instead of Nginx's own.
    absolute_redirect off;
    # The API refuses bodies over 1 MiB too; Nginx stops them earlier.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /api/ {
        # The API sets its own security headers on every response.
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Appends the client's address; the API trusts exactly this one hop
        # (TRUSTED_PROXY_HOPS=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $api_request_id;
        # A question can try three models of up to 30 seconds each.
        proxy_read_timeout 120s;
    }

    # Files whose name carries a content hash never change: cache them for a
    # year. A missing one is a 404, never index.html served as a script.
    location ~* "-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html and the few files without a hash (theme.js, favicon.svg):
    # always revalidated, so a deploy is picked up on the next load. Every
    # other path is a client-side route and gets index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
