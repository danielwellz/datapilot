# Alembic configuration for Flask-Migrate. The database URL comes from the
# application settings (see env.py), never from this file.

[alembic]
# Date-prefixed file names keep migrations listed in the order they were written.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# New migration files get the same lint fixes and formatting as the codebase.
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME
