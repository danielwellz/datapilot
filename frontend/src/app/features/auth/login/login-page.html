<main class="auth">
  <p class="auth__wordmark">DataPilot</p>

  <div class="auth__intro">
    <h1>Log in</h1>
    <p class="auth__lead">
      Sales numbers, order history and plain-English questions about your data.
    </p>
  </div>

  <form class="auth__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (formError(); as error) {
      <dp-form-alert [error]="error" />
    }

    <div class="field">
      <label class="field__label" for="login-email">Email</label>
      <input
        id="login-email"
        class="input"
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="errorFor('email') ? true : null"
        [attr.aria-describedby]="errorFor('email') ? 'login-email-error' : null"
      />
      @if (errorFor('email'); as message) {
        <p class="field__error" id="login-email-error">{{ message }}</p>
      }
    </div>

    <div class="field">
      <label class="field__label" for="login-password">Password</label>
      <input
        id="login-password"
        class="input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="errorFor('password') ? true : null"
        [attr.aria-describedby]="errorFor('password') ? 'login-password-error' : null"
      />
      @if (errorFor('password'); as message) {
        <p class="field__error" id="login-password-error">{{ message }}</p>
      }
    </div>

    <button class="button button--primary auth__submit" type="submit" [disabled]="pending()">
      {{ pending() ? 'Logging in' : 'Log in' }}
    </button>
  </form>

  <p class="auth__switch">
    New to DataPilot?
    <a routerLink="/register" [queryParams]="returnUrlParams">Create an account</a>
  </p>
</main>
