name: datapilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapilot}
      POSTGRES_DB: ${POSTGRES_DB:-datapilot}
    ports:
      # 5433 on the host avoids clashing with a locally installed PostgreSQL.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when the data volume is empty (first start or after `make reset-db`).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Bounded memory: bench runs and parameter combinations leave cache
    # entries behind until their TTL. Every cache entry and token has a TTL,
    # so volatile-lru evicts among them; the data version key has none.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
