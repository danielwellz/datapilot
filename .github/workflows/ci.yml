name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # Docker Official Images from Amazon ECR Public, which mirrors them with
    # the same digests: Docker Hub limits anonymous pulls per address, and
    # shared runners use that allowance up.
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: datapilot
          POSTGRES_PASSWORD: datapilot
          # CI only runs tests, so the service database is the test database.
          POSTGRES_DB: datapilot_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U datapilot -d datapilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://datapilot:datapilot@localhost:5433/datapilot_test
      TEST_DATABASE_URL: postgresql+psycopg://datapilot:datapilot@localhost:5433/datapilot_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      # Reports known vulnerabilities without failing the build: a fix may not
      # exist yet, and Dependabot proposes the update when one does.
      - name: Audit dependencies
        continue-on-error: true
        # bash, so the pipe runs with pipefail.
        shell: bash
        run: >-
          uv export --locked --no-dev --format requirements-txt --quiet
          | uvx pip-audit==2.10.1 --requirement /dev/stdin --disable-pip --progress-spinner off

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    env:
      # The Angular CLI otherwise asks whether to share usage data.
      NG_CLI_ANALYTICS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Check formatting
        run: npx prettier --check .

      - name: Test
        run: npx ng test --watch=false --coverage

      - name: Build
        run: npx ng build

      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  demo:
    name: Demo stack and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # The reviewer's path: no API keys, so Ask your data uses the demo model.
      - name: Build and start the stack
        run: cp .env.example .env && make demo

      - name: Install the smoke test and Chromium
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run the smoke test
        run: make e2e

      - name: Show the stack's logs
        if: failure()
        run: docker compose -f docker-compose.demo.yml --env-file .env --env-file .env.demo logs

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
